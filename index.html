<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="마이코드 - 이미지를 업로드하고 웹사이트용 이미지 코드로 바로 변환하는 도구" />
  <meta name="theme-color" content="#f6f6f2" />
  <title>마이코드 | MY CODE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="마이코드 홈">
      <span class="brand-mark">M</span>
      <span class="brand-copy">
        <strong>MY CODE</strong>
        <small>IMAGE URL & CODE</small>
      </span>
    </a>
    <div class="header-status">
      <span class="status-dot" id="firebaseStatusDot"></span>
      <span id="firebaseStatus">Firebase 확인 중</span>
    </div>
  </header>

  <main class="page-shell">
    <section class="intro">
      <p class="eyebrow">MY CODE / IMAGE TOOL</p>
      <h1>이미지를 올리면<br />웹사이트용 코드가 바로 만들어집니다.</h1>
      <p class="intro-copy">이미지를 끌어놓기만 하면 Firebase Storage에 업로드하고 URL, HTML, CSS 코드를 바로 생성합니다.</p>
    </section>

    <section class="upload-section">
      <button class="dropzone" id="dropzone" type="button">
        <span class="drop-icon">＋</span>
        <strong>이미지를 여기에 놓으세요</strong>
        <span>또는 클릭해서 파일 선택</span>
        <small>JPG · PNG · WEBP · GIF / 여러 장 가능</small>
      </button>
      <input id="fileInput" type="file" accept="image/*" multiple hidden />
    </section>

    <section class="result-section">
      <div class="result-head">
        <div>
          <p class="eyebrow">RESULT</p>
          <h2>생성된 이미지 코드</h2>
        </div>
        <div class="result-actions">
          <span id="fileCount">0개</span>
          <button class="text-button" id="clearButton" type="button">목록 비우기</button>
        </div>
      </div>

      <div class="empty-state" id="emptyState">이미지를 올리면 이곳에 URL과 코드가 생성됩니다.</div>
      <div class="result-list" id="resultGrid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <span>MY CODE</span>
    <span>Image URL & code workspace.</span>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
