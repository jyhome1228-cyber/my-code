<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b3fc7" />
  <meta name="description" content="이미지를 올리고 바로 img 코드를 복사하는 my:code" />
  <title>my:code — 이미지 올리고 코드 복사</title>
  <link rel="stylesheet" href="./simple-host.css?v=100" />
</head>
<body>
  <header class="topbar">
    <div class="logo">my<span>:</span>code</div>
    <span class="badge">BETA</span>
  </header>

  <main class="page">
    <section class="hero">
      <p class="kicker">IMAGE → CODE</p>
      <h1>이미지를 올리고,<br><span>코드만 복사하세요.</span></h1>
      <p>이미지 하나 올리면 웹에서 바로 쓸 수 있는 주소와<br><code>&lt;img src="..."&gt;</code> 한 줄을 만들어드려요.</p>
    </section>

    <section class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="이미지 업로드">
      <input id="fileInput" type="file" accept="image/*" multiple hidden />
      <div class="upload-icon">＋</div>
      <strong>이미지를 여기에 올려주세요</strong>
      <p>드래그하거나 클릭해서 파일 선택</p>
      <small>JPG · PNG · WEBP · GIF · SVG · 10MB 이하</small>
    </section>

    <div class="meta">
      <span>계정 입력 없음</span>
      <span>이미지 주소 생성</span>
      <span>IMG 코드 복사</span>
    </div>

    <section class="results" id="results" aria-live="polite"></section>

    <footer class="footer">
      <div><strong>소스트 스테이블랩스</strong><br>SOST STABLE LABS</div>
      <div>© 2026 SOST STABLE LABS</div>
    </footer>
  </main>

  <script src="./firebase/firebase-config.js?v=100"></script>
  <script type="module" src="./simple-host.js?v=100"></script>
</body>
</html>
